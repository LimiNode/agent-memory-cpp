# Machine-readable DBI manifest for agent-memory-cpp roadmap.
# Keep this file in sync with guides/mdbx-containers-extension-tz.md section 5.5/5.5.1.

version: agent_memory.dbi_manifest.v3
max_dbs_default: 96
minimum_free_slots: 16

canonical:
  - name: knowledge_units
    owner: core
    table_type: KeyValueTable
    opens: always
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: content_key_to_unit_id
    owner: core
    table_type: KeyValueTable
    opens: always
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [KnowledgeUnitKey]
    migration_peak: 1
  - name: knowledge_units_by_kind
    owner: core
    table_type: ReverseIndexTable
    opens: always
    wire_sync_support: dupsort_not_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, KnowledgeUnitKind]
    migration_peak: 1
  - name: unit_components
    owner: core
    table_type: TypeDiscriminatedTable
    physical_key: [ComponentKind, UnitId]
    opens: component_profile
    wire_sync_support: kv_supported_if_type_discriminated_is_kv_backed
    replication_semantics: logical_adapter_required
    migration_peak: 1
  - name: qa_payloads
    owner: qa
    table_type: KeyValueTable
    opens: QAPairs
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: fact_payloads
    owner: facts
    table_type: KeyValueTable
    opens: TemporalFact
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: conversation_episode_payloads
    owner: chat
    table_type: KeyValueTable
    opens: ConversationMemory
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: compiled_article_payloads
    owner: compiled_wiki
    table_type: KeyValueTable
    opens: CompiledArticles
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: chunk_payloads
    owner: ingestion
    table_type: KeyValueTable
    opens: always
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: source_refs
    owner: provenance
    table_type: KeyValueTable
    opens: FullSourceRefs
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [UnitId]
    migration_peak: 1
  - name: unit_projections
    owner: retrieval
    table_type: KeyValueTable
    opens: indexed_retrieval
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, UnitId, ProjectionKind, Revision]
    migration_peak: 1
  - name: embedding_meta
    owner: embeddings
    table_type: KeyValueTable
    opens: DenseVectors
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ModelId, ModelVersion, ProjectionKind, UnitId]
    migration_peak: 1
  - name: embedding_vectors
    owner: embeddings
    table_type: KeyValueTable
    opens: DenseVectors
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ModelId, ModelVersion, ProjectionKind, UnitId]
    migration_peak: 1
  - name: inverted_token_to_unit
    owner: lexical
    table_type: ReverseIndexTable
    opens: LexicalIndex
    wire_sync_support: dupsort_not_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, TokenId, FieldId]
    migration_peak: 1
  - name: field_to_postings
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, FieldId, TokenId, UnitId]
    migration_peak: 1
  - name: lexical_token_by_text
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, NormalizedTokenText]
    migration_peak: 1
  - name: lexical_token_by_id
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, TokenId]
    migration_peak: 1
  - name: lexical_chunk_stats
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, UnitId]
    migration_peak: 1
  - name: lexical_token_stats
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, TokenId]
    migration_peak: 1
  - name: lexical_collection_stats
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch]
    migration_peak: 1
  - name: lexical_active_snapshot
    owner: lexical
    table_type: KeyValueTable
    opens: LexicalIndex
    wire_sync_support: kv_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, ProjectionKind]
    migration_peak: 1
  - name: metadata_filters
    owner: metadata
    table_type: ReverseIndexTable
    opens: lightweight_prefilter
    wire_sync_support: dupsort_not_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, MetadataKey, MetadataValue]
    migration_peak: 1
  - name: graph_edges_by_src
    owner: graph
    table_type: ReverseIndexTable
    opens: GraphIndex
    wire_sync_support: dupsort_not_supported
    replication_semantics: logical_adapter_required
    physical_key: [ScopeId, FromUnitId, EdgeKind]
    migration_peak: 1
  - name: graph_edges_by_dst
    owner: graph
    table_type: ReverseIndexTable
    opens: GraphIndex
    wire_sync_support: dupsort_not_supported
    replication_semantics: logical_adapter_required
    physical_key: [ScopeId, ToUnitId, EdgeKind]
    migration_peak: 1
  - name: temporal_unit_index
    owner: temporal
    table_type: RangeIndexTable
    opens: TemporalIndex
    wire_sync_support: kv_supported_if_range_is_kv_backed
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, Timestamp, UnitId]
    migration_peak: 1
  - name: speaker_to_units
    owner: speaker
    table_type: ReverseIndexTable
    opens: SpeakerAttribution
    wire_sync_support: dupsort_not_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, SpeakerId]
    migration_peak: 1
  - name: session_to_units
    owner: speaker
    table_type: ReverseIndexTable
    opens: SpeakerAttribution
    wire_sync_support: dupsort_not_supported
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, SessionId]
    migration_peak: 1
  - name: usage_by_last_access
    owner: usage
    table_type: RangeIndexTable
    opens: UsageTracking
    wire_sync_support: kv_supported_if_range_is_kv_backed
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, LastUsedAtMs, UnitId]
    migration_peak: 1
  - name: usage_by_cooldown
    owner: usage
    table_type: RangeIndexTable
    opens: UsageTracking
    wire_sync_support: kv_supported_if_range_is_kv_backed
    replication_semantics: derived_rebuildable
    physical_key: [ScopeId, CooldownUntilMs, UnitId]
    migration_peak: 1
  - name: schema_info
    owner: schema
    table_type: KeyValueTable
    opens: always
    wire_sync_support: kv_supported
    replication_semantics: logical_adapter_required
    physical_key: [SchemaKey]
    migration_peak: 1

profile_deltas:
  - name: legacy_document_resource_adapter
    dbis: 4
    migration_peak: 4
    default: false
    schema_status: capacity_reserve_only
  - name: shared_runtime_queue
    dbis: 5
    migration_peak: 5
    default: false
    names: [jobs_by_id, jobs_scheduled, jobs_ready, jobs_by_lease, jobs_by_status]
    dbi_entries:
      - name: jobs_by_id
        owner: runtime_services
        table_type: KeyValueTable
        opens: RuntimeQueue
        wire_sync_support: kv_supported
        replication_semantics: raw_mirror_only
        physical_key: [JobId]
        migration_peak: 1
      - name: jobs_scheduled
        owner: runtime_services
        table_type: RangeIndexTable
        opens: RuntimeQueue
        wire_sync_support: kv_supported_if_range_is_kv_backed
        replication_semantics: raw_mirror_only
        physical_key: [RunAfterMs, JobId]
        migration_peak: 1
      - name: jobs_ready
        owner: runtime_services
        table_type: RangeIndexTable
        opens: RuntimeQueue
        wire_sync_support: kv_supported_if_range_is_kv_backed
        replication_semantics: raw_mirror_only
        physical_key: [PriorityRank, JobId]
        migration_peak: 1
      - name: jobs_by_lease
        owner: runtime_services
        table_type: RangeIndexTable
        opens: RuntimeQueue
        wire_sync_support: kv_supported_if_range_is_kv_backed
        replication_semantics: raw_mirror_only
        physical_key: [LeaseUntilMs, JobId]
        migration_peak: 1
      - name: jobs_by_status
        owner: runtime_services
        table_type: ReverseIndexTable
        opens: RuntimeQueue
        wire_sync_support: dupsort_not_supported
        replication_semantics: raw_mirror_only
        physical_key: [JobStatus]
        migration_peak: 1
  - name: compaction_handoff
    dbis: 1
    migration_peak: 1
    default: false
    names: [compaction_handoffs]
    dbi_entries:
      - name: compaction_handoffs
        owner: compaction
        table_type: KeyValueTable
        opens: Compaction
        wire_sync_support: kv_supported
        replication_semantics: raw_mirror_only
        physical_key: [JobId]
        migration_peak: 1
  - name: resource_body_simple_kv
    dbis: 1
    migration_peak: 1
    default: false
    names: [resource_bodies]
    dbi_entries:
      - name: resource_bodies
        owner: provenance
        table_type: KeyValueTable
        opens: ResourceBodyStore
        wire_sync_support: kv_supported
        replication_semantics: logical_adapter_required
        physical_key: [ResourceId, BodyRevision, BodyDigest]
        migration_peak: 1
  - name: resource_body_chunked
    dbis: 2
    migration_peak: 2
    default: false
    names: [resource_body_manifest, resource_body_chunks]
    dbi_entries:
      - name: resource_body_manifest
        owner: provenance
        table_type: KeyValueTable
        opens: ResourceBodyStore
        wire_sync_support: kv_supported
        replication_semantics: logical_adapter_required
        physical_key: [ResourceId, BodyRevision, BodyDigest]
        migration_peak: 1
      - name: resource_body_chunks
        owner: provenance
        table_type: KeyValueTable
        opens: ResourceBodyStore
        wire_sync_support: kv_supported
        replication_semantics: logical_adapter_required
        physical_key: [ResourceId, BodyRevision, ChunkIndex]
        migration_peak: 1
  - name: source_refs_by_resource
    dbis: 1
    migration_peak: 1
    default: false
    names: [source_refs_by_resource]
    dbi_entries:
      - name: source_refs_by_resource
        owner: provenance
        table_type: ReverseIndexTable
        opens: FullSourceRefs
        wire_sync_support: dupsort_not_supported
        replication_semantics: derived_rebuildable
        physical_key: [ResourceId]
        migration_peak: 1
  - name: global_unit_id_to_local_id
    dbis: 1
    migration_peak: 1
    default: false
    names: [global_unit_id_to_local_id]
    capability: DurableGlobalIdentity
    milestone: M1b
    note: Common GlobalKnowledgeUnitId -> (ScopeId, KnowledgeUnitId) profile; identity is unique across one storage environment and is not runtime-lane-owned. M1b structured knowledge/import-export profiles consume it; A0 may reuse it.
    dbi_entries:
      - name: global_unit_id_to_local_id
        owner: knowledge_identity
        table_type: KeyValueTable
        opens: DurableGlobalIdentity
        wire_sync_support: kv_supported
        replication_semantics: logical_adapter_required
        physical_key: [GlobalKnowledgeUnitId]
        migration_peak: 1
  - name: runtime_sequence_index
    dbis: 1
    migration_peak: 1
    default: false
    names: [runtime_sequence_index]
    milestone: A1
    note: "Discriminated range keys: (ScopeId, ProducerEvent, encoded_origin, sequence, UnitId) for rebuildable producer events and (ScopeId, VisibilityReceipt, encoded_origin, sequence, GlobalKnowledgeUnitId) for durable origin-local KnowledgeAtSequence receipts. The receipt logical identity excludes sequence: (GlobalKnowledgeUnitId, RuntimeOriginKey) is one immutable first-visible fact."
    dbi_entries:
      - name: runtime_sequence_index
        owner: runtime_integration
        table_type: RangeIndexTable
        opens: SequenceReplay
        wire_sync_support: kv_supported_if_range_is_kv_backed
        replication_semantics: logical_adapter_required
        physical_key: [ScopeId, RuntimeSequenceRowKind, EncodedOrigin, Sequence, StableId]
        migration_peak: 1
  - name: lexical_posting_segments
    dbis: 1
    migration_peak: 1
    default: false
    names: [lexical_posting_segments]
    capability: LexicalIndex
    milestone: M2
    note: Immutable compressed lexical posting blocks with conservative skip and score-bound metadata; replaces neither canonical unit rows nor exhaustive BM25F baseline.
    dbi_entries:
      - name: lexical_posting_segments
        owner: lexical
        table_type: KeyValueTable
        opens: LexicalIndex
        wire_sync_support: kv_supported
        replication_semantics: derived_rebuildable
        physical_key: [ScopeId, ProjectionKind, LexicalStatisticsEpoch, FieldId, TokenId, SegmentId]
        migration_peak: 1
  - name: derived_vector_blob_dedup
    dbis: 1
    migration_peak: 1
    default: false
    names: [derived_vector_blobs]
    capability: DenseVectors
    milestone: M2
    note: Scope-local immutable encoded-vector payload deduplication; projection metadata and lifecycle remain per-unit.
    dbi_entries:
      - name: derived_vector_blobs
        owner: embeddings
        table_type: KeyValueTable
        opens: DenseVectors
        wire_sync_support: kv_supported
        replication_semantics: derived_rebuildable
        physical_key: [ScopeId, VectorCodecId, BlobDigest]
        migration_peak: 1
  - name: event_record_index
    dbis: 1
    migration_peak: 1
    default: false
    milestone: M2+
    note: Future profile delta only if agent-memory introduces EventRecord as an entity separate from KnowledgeUnit.
    schema_status: capacity_reserve_only
  - name: sync_system_be72a2b
    dbis: 9
    migration_peak: 9
    default: false
    names:
      - _mdbxc_meta
      - _mdbxc_changelog
      - _mdbxc_origins
      - _mdbxc_applied
      - _mdbxc_identity_index
      - _mdbxc_sync_schema
      - _mdbxc_logical_delivery
      - _mdbxc_logical_delivery_order
      - _mdbxc_logical_outbox
    note: Conservative max_dbs reserve. Normal SyncEngine initialization eagerly creates 7 DBIs; raw capture lazily creates _mdbxc_origins (+1), and _mdbxc_identity_index is a deferred direct-use-only path (+1).
    dbi_entries:
      - name: _mdbxc_meta
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_changelog
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_origins
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_applied
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_identity_index
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_sync_schema
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_logical_delivery
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_logical_delivery_order
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
      - name: _mdbxc_logical_outbox
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
  - name: logical_delivery_watermark_pruning
    dbis: 1
    migration_peak: 1
    default: false
    names: [_mdbxc_logical_delivery_watermarks]
    note: Optional sync DBI created lazily by SyncEngine::prune_logical_delivery_markers(); later delivery/watermark reads open it only when it already exists. Profiles enabling marker pruning must reserve this delta in addition to sync_system_be72a2b.
    dbi_entries:
      - name: _mdbxc_logical_delivery_watermarks
        owner: upstream_sync
        table_type: UpstreamSystemDBI
        opens: UpstreamSync
        wire_sync_support: upstream_managed
        replication_semantics: upstream_managed
        physical_key: [UpstreamInternal]
        migration_peak: 1
  - name: migration_dual_write_reserve
    dbis: 0
    migration_peak: 8
    default: false
    schema_status: capacity_reserve_only

expanded_peak_reference:
  canonical_full_inventory: 30
  legacy_document_resource_adapter: 4
  shared_runtime_queue: 5
  compaction_handoff: 1
  resource_body_chunked: 2
  source_refs_by_resource: 1
  global_unit_id_to_local_id: 1
  runtime_sequence_index: 1
  sync_system_be72a2b: 9
  migration_dual_write_reserve: 8
  total: 62

runtime_integration_mapping:
  a0_a2_component_only_new_runtime_dbis: 0
  cognitive_trace_components: unit_components
  task_decision_procedure_payloads: unit_components
  causal_relations: [graph_edges_by_src, graph_edges_by_dst]
  raw_event_payloads: resource_body_profile_delta
  global_identity_lookup: global_unit_id_to_local_id
  sequence_filtering: runtime_sequence_index
  visibility_receipts: runtime_sequence_index
  future_partition_candidates:
    - replica_frontiers
    - reconciliation_jobs
  notes:
    - A0/A2 component-only profiles add no runtime-specific DBIs; SequenceReplay is an explicit A1 opt-in delta.
    - A0-A2 do not add a separate runtime_event_index or temporal_event_index.
    - Future partition DBIs are not budgeted until a concrete implementation task updates profile_deltas.
