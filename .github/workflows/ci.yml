name: ci

on:
  push:
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=ON
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  mdbx:
    name: MDBX wiring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Init flat MDBX submodules
        run: git submodule update --init external/libmdbx external/mdbx-containers

      - name: Configure
        run: >
          cmake -S . -B build-mdbx
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_ENABLE_MDBX=ON
          -DAGENT_MEMORY_MDBX_DEPS_MODE=BUNDLED
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build-mdbx --config Release

      - name: Test
        run: ctest --test-dir build-mdbx --build-config Release --output-on-failure

  mdbx-benchmark:
    name: MDBX benchmark harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Init flat MDBX submodules
        run: git submodule update --init external/libmdbx external/mdbx-containers

      - name: Configure benchmark harness
        run: >
          cmake -S . -B build-mdbx-benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_ENABLE_MDBX=ON
          -DAGENT_MEMORY_MDBX_DEPS_MODE=BUNDLED
          -DAGENT_MEMORY_BUILD_BENCHMARKS=ON
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build storage benchmark harness
        run: cmake --build build-mdbx-benchmark --config Release --target agent-memory-mih-storage-bench

      - name: Test storage benchmark harness
        run: ctest --test-dir build-mdbx-benchmark --build-config Release --output-on-failure -R agent_memory_mih_storage

  native-mih-benchmark:
    name: Native MIH benchmark harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Configure native MIH benchmark harness
        run: >
          cmake -S . -B build-native-mih
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_BUILD_BENCHMARKS=ON
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build native MIH benchmark harness
        run: >
          cmake --build build-native-mih --config Release --target
          agent-memory-mih-native-hot-path
          agent-memory-mih-native-sparse-arbitrary-m

      - name: Test native MIH benchmark harness
        run: ctest --test-dir build-native-mih --build-config Release --output-on-failure -R agent_memory_mih_native_

  r4-native-benchmark:
    name: R4 native benchmark harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Init SIMDComp
        run: git submodule update --init external/simdcomp

      - name: Configure R4 benchmark harness
        run: >
          cmake -S . -B build-r4
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_BUILD_BENCHMARKS=ON
          -DAGENT_MEMORY_BUILD_TESTS=OFF
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build R4 benchmark harness
        run: >
          cmake --build build-r4 --config Release --target
          agent-memory-neuroute-r4-layout-benchmark
          agent-memory-neuroute-r4-representative-codec
          agent-memory-neuroute-record-codec-contract
          agent-memory-neuroute-final-representation

      - name: Run R4 native self-test (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./build-r4/tools/agent-memory-bench/agent-memory-neuroute-r4-layout-benchmark --self-test
          ./build-r4/tools/agent-memory-bench/agent-memory-neuroute-record-codec-contract --self-test
          ./build-r4/tools/agent-memory-bench/agent-memory-neuroute-final-representation --self-test

      - name: Run R4 native self-test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build-r4\tools\agent-memory-bench\Release\agent-memory-neuroute-r4-layout-benchmark.exe --self-test
          .\build-r4\tools\agent-memory-bench\Release\agent-memory-neuroute-record-codec-contract.exe --self-test
