name: ci

on:
  push:
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=ON
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  mdbx:
    name: MDBX wiring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Init flat MDBX submodules
        run: git submodule update --init external/libmdbx external/mdbx-containers

      - name: Configure
        run: >
          cmake -S . -B build-mdbx
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_ENABLE_MDBX=ON
          -DAGENT_MEMORY_MDBX_DEPS_MODE=BUNDLED
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build build-mdbx --config Release

      - name: Test
        run: ctest --test-dir build-mdbx --build-config Release --output-on-failure

  mdbx-benchmark:
    name: MDBX benchmark harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Init flat MDBX submodules
        run: git submodule update --init external/libmdbx external/mdbx-containers

      - name: Configure benchmark harness
        run: >
          cmake -S . -B build-mdbx-benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_ENABLE_MDBX=ON
          -DAGENT_MEMORY_MDBX_DEPS_MODE=BUNDLED
          -DAGENT_MEMORY_BUILD_BENCHMARKS=ON
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build storage benchmark harness
        run: cmake --build build-mdbx-benchmark --config Release --target agent-memory-mih-storage-bench

      - name: Test storage benchmark harness
        run: ctest --test-dir build-mdbx-benchmark --build-config Release --output-on-failure -R agent_memory_mih_storage

  native-mih-benchmark:
    name: Native MIH benchmark harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements-tools.txt

      - name: Configure native MIH benchmark harness
        run: >
          cmake -S . -B build-native-mih
          -DCMAKE_BUILD_TYPE=Release
          -DAGENT_MEMORY_BUILD_BENCHMARKS=ON
          -DAGENT_MEMORY_BUILD_TESTS=ON
          -DAGENT_MEMORY_BUILD_EXAMPLES=OFF
          -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build native MIH benchmark harness
        run: cmake --build build-native-mih --config Release --target agent-memory-mih-native-hot-path

      - name: Test native MIH benchmark harness
        run: ctest --test-dir build-native-mih --build-config Release --output-on-failure -R agent_memory_mih_native_hot_path

  ann-cascade:
    name: ANN cascade harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ANN comparison dependencies
        run: python -m pip install -r tools/agent-memory-bench/requirements-ann-cascade-comparison.txt
      - name: Exercise external ANN bindings
        run: python tools/agent-memory-bench/evaluate-ann-cascade.py self-test --external
      - name: Exercise MIH budgeted-confidence contracts
        run: >
          python tools/agent-memory-bench/evaluate-mih-banding.py self-test &&
          python tools/agent-memory-bench/run-mih-calibrated-weighted-hamming-matrix.py self-test
          --matrix tools/agent-memory-bench/mih-calibrated-weighted-hamming.example.json &&
          python tools/agent-memory-bench/run-mih-budgeted-confidence-matrix.py self-test
          --matrix tools/agent-memory-bench/mih-budgeted-confidence-k1.example.json &&
          python tools/agent-memory-bench/bootstrap-mih-budgeted-confidence.py self-test &&
          python tools/agent-memory-bench/validate-mih-budgeted-confidence-evidence.py self-test
      - name: Exercise ANN evidence bootstrap contract
        run: python tools/agent-memory-bench/write-ann-cascade-evidence.py --self-test
