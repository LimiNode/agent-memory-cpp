          python tools/agent-memory-bench/write-neuroute-r4-int5-kernel-frontier-evidence.py --self-test &&
          python tools/agent-memory-bench/run-neuroute-dense-performance-audit.py --self-test &&
          python tools/agent-memory-bench/write-neuroute-dense-performance-audit-evidence.py --self-test &&
          python tools/agent-memory-bench/run-neuroute-final-rerank-ceiling.py --self-test &&
          python tools/agent-memory-bench/write-neuroute-final-rerank-ceiling-evidence.py --self-test &&
          python tools/agent-memory-bench/run-neuroute-storage-execution-separation.py --self-test &&
          python tools/agent-memory-bench/write-neuroute-storage-execution-separation-evidence.py --self-test &&
          python tools/agent-memory-bench/materialize-neuroute-k8-coarse.py --self-test &&
